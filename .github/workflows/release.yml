name: Test and publish workplace kit

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: workplace-release
  cancel-in-progress: false

jobs:
  micropython:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Test firmware logic on MicroPython 1.29 Unix port
        run: |
          git clone --depth 1 --branch v1.29.0 https://github.com/micropython/micropython.git /tmp/micropython
          test "$(git -C /tmp/micropython rev-parse HEAD)" = '0fd6c573ea815774668bbb16b8e197c8822368b2'
          make -C /tmp/micropython/ports/unix submodules
          make -C /tmp/micropython/ports/unix MICROPY_PY_FFI=0 MICROPY_PY_SSL=0 -j2
          MICROPYPATH="$PWD/device" /tmp/micropython/ports/unix/build-standard/micropython tests/micropython_smoke.py

  release:
    needs: micropython
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '25'
      - name: Install build and test dependencies
        shell: pwsh
        run: |
          python -m pip install -r pc/requirements.txt -r pc/requirements-assets.txt -r pc/requirements-dev.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm --prefix integration/openbuddy ci --ignore-scripts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Check deployable files with MicroPython 1.29
        run: python -m tools.check_micropython
      - name: Build standalone plugin
        run: |
          npm --prefix integration/openbuddy run build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          foreach ($file in @('index.js', 'package.json', 'LICENSES.txt')) {
            if ((Get-FileHash "integration/openbuddy/dist/$file").Hash -ne (Get-FileHash "plugin/openbuddy/$file").Hash) {
              throw "The committed plugin/openbuddy/$file does not match the built plugin"
            }
          }
      - name: Python tests
        run: python -m unittest discover -s tests -v
      - name: Plugin tests
        run: npm --prefix integration/openbuddy test
      - name: Plugin types
        run: npm --prefix integration/openbuddy run typecheck
      - name: Build offline workplace ZIPs
        run: |
          python tools/package_workplace.py --variant bluetooth --download-wheels
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/package_workplace.py --variant usb --download-wheels
      - name: Verify clean offline installations
        run: |
          python tools/verify_workplace.py dist/openbuddy-workplace.zip
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/verify_workplace.py dist/openbuddy-workplace-usb.zip
      - name: Publish versioned release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = python -c "import json,zipfile; z=zipfile.ZipFile('dist/openbuddy-workplace.zip'); print(json.loads(z.read('openbuddy-workplace/MANIFEST.json'))['version'])"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $tag = "v$version"
          gh release view $tag --repo "$env:GITHUB_REPOSITORY" *> $null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Release $tag already exists; leaving its assets untouched."
            exit 0
          }
          gh release create $tag dist/openbuddy-workplace.zip dist/openbuddy-workplace.zip.sha256 dist/openbuddy-workplace-usb.zip dist/openbuddy-workplace-usb.zip.sha256 --repo "$env:GITHUB_REPOSITORY" --target "$env:GITHUB_SHA" --title "OpenBuddy $version - Windows notifications, Bluetooth and USB offline kits" --notes-file distribution/workplace/RELEASE.md
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
